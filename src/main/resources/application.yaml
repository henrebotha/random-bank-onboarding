spring:
  application:
    name: onboarding
  datasource:
    url: jdbc:h2:mem:random_bank_onboarding
    username: sa
    password: password
    driverClassName: org.h2.Driver
  sql:
    init:
      mode: embedded
  h2:
    console:
      enabled: true # TODO: delete me
  jpa:
    generate-ddl: true
    url: jdbc:h2:mem:random_bank_onboarding
    password: password
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
