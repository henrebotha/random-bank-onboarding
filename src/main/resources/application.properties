spring.application.name=onboarding
spring.datasource.url=jdbc:h2:mem:random-bank-users;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
random-bank-onboarding.valid-countries=NL,BE
random-bank-onboarding.validate-address=false
random-bank-onboarding.throttle-db=false
logging.level.org.hibernate.orm.jdbc.bind=trace
spring.jpa.show-sql=true
server.servlet.session.timeout=1m
logging.level.root=info
logging.level.org.springframework=debug
